[package]
name = "rust_learn_wgpu"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
anyhow = "1.0.104"
fs_extra = "1.3.0"

[dependencies]
anyhow = "1.0"
winit = "0.30.13"
env_logger = "0.11.11"
log = "0.4.34"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.6", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tobj = { version = "4.0.5", default-features = false, features = ["async"] }
web-time = "1.1.0"

# WASM
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.1.0"
wgpu = { version = "30.0", features = ["webgl"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
reqwest = "0.13.4"
web-sys = { version = "0.3.104", features = [
    "Document",
    "Window",
    "Element",
    "Location",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# ANDROID
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[package.metadata.android]
package = "dev.lempek.rustlearn"
apk_label = "RustLearnWgpu"
target_sdk_version = 36
min_sdk_version = 34
build_targets = ["x86_64-linux-android"]

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|keyboardHidden|screenSize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rust_learn_wgpu"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]