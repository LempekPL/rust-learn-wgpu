[package]
name = "rust_shopping_app"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

#[[bin]]
#path = "src/lib.rs"

[lib]
#path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30.13", features = ["android-native-activity"] }
env_logger = "0.11.11"
log = "0.4.34"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
cgmath = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.1.0"
wgpu = { version = "30.0", features = ["webgl"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
android-activity = { version = "0.6.1", features = ["native-activity"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[package.metadata.android]
package = "dev.lempek.rustshopping"
apk_label = "ShoppingList"
target_sdk_version = 36
min_sdk_version = 34
build_targets = ["x86_64-linux-android"]

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|keyboardHidden|screenSize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rust_shopping_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]